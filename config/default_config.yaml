# Default configuration for InternAgent
# This file is loaded when no specific config path is provided

version: "1.0.0"

# Model Providers Configuration
models:
  openai:
    model_name: "qwen-vl-max"
    api_key: ""  # Set via environment variable OPENAI_API_KEY
    max_tokens: 10000
    temperature: 0.7
  qwen3_max:
    model_name: "qwen3-max"
    api_key: ""  # Set via environment variable QWEN3_API_KEY or reuse OPENAI_API_KEY
    max_tokens: 10000
    temperature: 0.6
  interns1:
    model_name: "intern-s1"
    api_key: "" # Set via environment variable DS_API_KEY
    max_tokens: 10000
    temperature: 0.7

# Memory Configuration
memory:
  backend: "file_system"
  file_dir: "results"

# Agent Configuration
agents:
  # Idea Generation Agent
  generation:
    model_provider: "openai"
    generation_count: 5
    creativity: 0.7
    do_survey: false

  # Reflection Agent
  reflection:
    model_provider: "openai"
    detail_level: "medium"

  # Evolution Agent
  evolution:
    model_provider: "openai"
    creativity_level: 0.6

  # Method Development Agent
  method_development:
    model_provider: "openai"
    model_name: "gpt-4"

  # Refinement Agent
  refinement:
    model_provider: "openai"
    model_name: "gpt-4"

  # Ranking Agent
  ranking:
    model_provider: "openai"

  # Scholar Agent
  scholar:
    model_provider: "openai"
    search_depth: "moderate"

  # Survey Agent
  survey:
    model_provider: "openai"

  # Literature Summary Agent
  literature_summary:
    model_provider: "openai"

  # Engineer Agent
  engineer:
    model_provider: "qwen3_max"
    max_actions: 5
    default_language: "python"
    require_tests: true

  # Task Decomposition Agent (multimodal)
  task_decomposition:
    model_provider: "openai"
    temperature: 0.3

  # Judger Agent
  judger:
    model_provider: "interns1"

  # Logical Coherence Reviewer Agent
  logical_coherence_reviewer:
    model_provider: "qwen3_max"
    
  # Pedagogical Reviewer Agent
  pedagogical_reviewer:
    model_provider: "interns1"

# Workflow Configuration
workflow:
  max_iterations: 2
  top_ideas_count: 3
  top_ideas_evo: false
  max_concurrent_tasks: 5
