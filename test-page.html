<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>测试页面</title>
</head>
<body>
  <h1>测试页面</h1>
  <button id="testBtn">测试按钮</button>
  <div id="result"></div>
  
  <script src="project-structure-config.js"></script>
  <script>
    // 测试配置是否加载
    if (window.ProjectStructureConfig) {
      document.getElementById('result').innerHTML = '✓ ProjectStructureConfig 已加载<br>';
      console.log('配置版本:', window.ProjectStructureConfig.version);
    } else {
      document.getElementById('result').innerHTML = '✗ ProjectStructureConfig 未加载<br>';
    }
    
    // 测试按钮点击
    document.getElementById('testBtn').addEventListener('click', () => {
      document.getElementById('result').innerHTML += '✓ 按钮点击事件正常<br>';
    });
  </script>
</body>
</html>
